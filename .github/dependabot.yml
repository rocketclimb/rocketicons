version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # develop is the default branch. Omitting target-branch lets these rules
    # apply to security updates as well as scheduled version updates.
    schedule:
      interval: "weekly"
    groups:
      compatible-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        # These updates need catalog, visual, or NativeWind compatibility review.
        # Excluding them from a group still permits individual update PRs.
        exclude-patterns:
          - "lucide-static"
          - "@primer/octicons"
          - "satori"
          - "cheerio"
          - "react-native"
          - "react-native-svg"
          - "nativewind"
          - "react-native-css-interop"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"
      compatible-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
        # These updates need catalog, visual, or NativeWind compatibility review.
        # Excluding them from a group still permits individual update PRs.
        exclude-patterns:
          - "lucide-static"
          - "@primer/octicons"
          - "satori"
          - "cheerio"
          - "react-native"
          - "react-native-svg"
          - "nativewind"
          - "react-native-css-interop"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"
    # Major upgrades remain separate migration PRs.
    ignore:
      # These aliases intentionally provide the Ionicons 4 and 5 catalogs.
      - dependency-name: "ionicons"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "ionicons-5"
        update-types:
          - "version-update:semver-major"
