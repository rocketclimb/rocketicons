name: Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and export static site
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://rocketicons.io' }}
      RI_GENERATE_ALL_ICONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate SITE_ORIGIN
        run: |
          test -n "$SITE_ORIGIN"
          node -e 'const value = new URL(process.env.SITE_ORIGIN); if (!/^https?:$/.test(value.protocol) || value.search || value.hash || value.username || value.password) process.exit(1)'

      - name: Configure GitHub Packages
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ github.token }}

      - name: Cache generated icons
        uses: actions/cache@v4
        with:
          path: |
            packages/generator/icons
            packages/generator/svgs
          key: ${{ runner.os }}-node-22-icons-${{ hashFiles('packages/generator/src/**', 'packages/generator/package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-icons-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages and icons
        env:
          SKIP_IGNITION_BUILD: "true"
        run: npm run build-all

      - name: Test workspace
        run: npm run test-all

      - name: Generate content collections
        run: npm run generate-content-collections --workspace=packages/ignition

      - name: Generate complete static catalog
        run: npm run generate-statics:all-icons --workspace=packages/ignition

      - name: Export Next.js site
        env:
          SKIP_GENERATE_CONTENT_COLLECTIONS: "true"
          SKIP_GENERATE_IGNITION_STATICS: "true"
        run: npm run build --workspace=packages/ignition

      - name: Verify export
        run: |
          test -f packages/ignition/out/index.html
          test -f packages/ignition/out/en/index.html
          test -f packages/ignition/out/pt-br/index.html
          test -f packages/ignition/out/ai/v1/catalog.json
          size_kib=$(du -sk packages/ignition/out | cut -f1)
          test "$size_kib" -le 921600
          echo "Export size: $size_kib KiB"

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/ignition/out --project-name=rocketicons --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Cloudflare Pages preview
        id: deploy-preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/ignition/out --project-name=rocketicons --branch=pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add preview URL to workflow summary
        if: steps.deploy-preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.pages-deployment-alias-url }}
        run: |
          test -n "$PREVIEW_URL"
          echo "### Cloudflare Pages preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$PREVIEW_URL]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
