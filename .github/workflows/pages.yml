name: Cloudflare Pages

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      synchronize_algolia:
        description: Synchronize the production Algolia index from this revision
        type: boolean
        required: false
        default: false
      cleanup_preview_pr:
        description: Retire a PR preview after an interrupted or failed close run
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  deployments: write
  pull-requests: write

concurrency:
  group: >-
    ${{
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') &&
      'rocketicons-production' || format('cloudflare-pages-{0}', github.ref)
    }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and export static site
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (github.event_name != 'workflow_dispatch' || inputs.cleanup_preview_pr == '')
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://rocketicons.com' }}
      RI_GENERATE_ALL_ICONS: "true"
      NEXT_PUBLIC_ALGOLIA_APPLICATION_ID: ${{ vars.ALGOLIA_APPLICATION_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_ONLY_API_KEY: ${{ vars.ALGOLIA_SEARCH_ONLY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment configuration
        run: |
          test -n "$SITE_ORIGIN"
          test -n "$NEXT_PUBLIC_ALGOLIA_APPLICATION_ID"
          test -n "$NEXT_PUBLIC_ALGOLIA_SEARCH_ONLY_API_KEY"
          node -e 'const value = new URL(process.env.SITE_ORIGIN); if (!/^https?:$/.test(value.protocol) || value.search || value.hash || value.username || value.password) process.exit(1)'

      - name: Configure GitHub Packages
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ github.token }}

      - name: Cache generated icons
        uses: actions/cache@v4
        with:
          path: |
            packages/generator/icons
            packages/generator/svgs
          key: ${{ runner.os }}-node-22-icons-${{ hashFiles('packages/generator/src/**', 'packages/generator/package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-icons-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build packages and icons
        env:
          SKIP_IGNITION_BUILD: "true"
        run: npm run build-all

      - name: Test workspace
        run: npm run test-all

      - name: Generate content collections
        run: npm run generate-content-collections --workspace=packages/ignition

      - name: Generate complete static catalog
        run: npm run generate-statics:all-icons --workspace=packages/ignition

      - name: Export Next.js site
        env:
          SKIP_GENERATE_CONTENT_COLLECTIONS: "true"
          SKIP_GENERATE_IGNITION_STATICS: "true"
        run: npm run build --workspace=packages/ignition

      - name: Verify export
        run: |
          test -f packages/ignition/out/index.html
          test -f packages/ignition/out/en/index.html
          test -f packages/ignition/out/pt-br/index.html
          test -f packages/ignition/out/ai/v1/catalog.json
          size_kib=$(du -sk packages/ignition/out | cut -f1)
          test "$size_kib" -le 921600
          echo "Export size: $size_kib KiB"

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/ignition/out --project-name=rocketicons --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize Algolia index
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.synchronize_algolia && github.ref == 'refs/heads/main')
        env:
          ALGOLIA_INDEXING_API_KEY: ${{ secrets.ALGOLIA_INDEXING_API_KEY }}
        run: |
          test -n "$ALGOLIA_INDEXING_API_KEY"
          npm run indexer --workspace=packages/ignition

      - name: Deploy Cloudflare Pages preview
        id: deploy-preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/ignition/out --project-name=rocketicons --branch=pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add preview URL to workflow summary
        if: steps.deploy-preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.pages-deployment-alias-url }}
        run: |
          test -n "$PREVIEW_URL"
          echo "### Cloudflare Pages preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$PREVIEW_URL]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview URL to GitHub
        if: steps.deploy-preview.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEW_ACTION: publish
          PREVIEW_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_REF: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.pages-deployment-alias-url }}
        run: node .github/scripts/github-pages-preview.mjs

  cleanup-preview:
    name: Retire PR preview
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.cleanup_preview_pr != '')
    runs-on: ubuntu-latest
    env:
      PREVIEW_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.cleanup_preview_pr }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Wrangler Action installs Wrangler from the checkout root even when its
      # command runs in a working directory, so its install needs package auth.
      - name: Configure GitHub Packages
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ github.token }}

      - name: Validate preview PR number
        run: '[[ "$PREVIEW_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]'

      # Pages does not allow deletion of a branch's latest deployment. Replace
      # the preview with a tiny redirect so the real preview can be deleted.
      - name: Retire Cloudflare Pages preview
        id: retire-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .github/preview-closed
          command: pages deploy . --project-name=rocketicons --branch=pr-${{ env.PREVIEW_PR_NUMBER }}

      - name: Delete superseded preview deployments
        id: delete-previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: rocketicons
          PREVIEW_BRANCH: pr-${{ env.PREVIEW_PR_NUMBER }}
          KEEP_DEPLOYMENT_ID: ${{ steps.retire-preview.outputs.pages-deployment-id }}
        run: node .github/scripts/cleanup-pages-preview.mjs

      - name: Retire GitHub preview deployment
        if: always() && steps.retire-preview.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREVIEW_ACTION: retire
          PREVIEW_ENVIRONMENT: pr-${{ env.PREVIEW_PR_NUMBER }}
          PREVIEW_PR_NUMBER: ${{ env.PREVIEW_PR_NUMBER }}
          PREVIEW_REF: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: https://pr-${{ env.PREVIEW_PR_NUMBER }}.rocketicons.pages.dev
        run: node .github/scripts/github-pages-preview.mjs
