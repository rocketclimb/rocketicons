name: Prepare Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  NODE_VERSION: "22.x"

permissions: write-all

concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-artifacts:
    name: Prepare Artifacts
    if: github.head_ref == 'develop'
    runs-on: ubuntu-latest
    env:
      PRE_RELEASE_TAG: ${{ vars.PRE_RELEASE_TAG }}
      AUTOMATION_USER_NAME: ${{ vars.AUTOMATION_USER_NAME }}
      AUTOMATION_USER_EMAIL: ${{ vars.AUTOMATION_USER_EMAIL }}
      SKIP_IGNITION_BUILD: true

    outputs:
      tag-name: ${{ steps.prepare-release.outputs.TAG_NAME }}
      publish-package: ${{ steps.prepare-release.outputs.PUBLISH_PACKAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Validate release source branch
        env:
          SOURCE_HEAD_BRANCH: ${{ github.head_ref }}
        run: node .github/scripts/release-guard.mjs validate-source "$SOURCE_HEAD_BRANCH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set NPM config
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Cache icons
        uses: actions/cache@v4
        id: icons-cache
        with:
          path: |
            packages/generator/icons
          key: ${{ runner.os }}-icons-${{ hashFiles('packages/generator/src/definitions.ts') }}
          restore-keys: |
            ${{ runner.os }}-icons-

      - name: Install packages
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          SKIP_BUILD_ALL=true npm ci

      - name: Icons Fetch
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: npm run fetch --workspace=packages/generator

      - name: Build All
        run: npm run build-all

      - name: Run tests
        run: npm run test-all

      - name: Setup git user
        run: |
          git config user.name ${{ env.AUTOMATION_USER_NAME }}
          git config user.email ${{ env.AUTOMATION_USER_EMAIL }}

      - name: Prepare tag or release
        id: prepare-release
        run: |
          PUBLISHED_VERSION="$(npm view rocketicons version)"
          CURRENT_VERSION="$(node -p "require('./packages/icons/package.json').version")"

          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            TAG_NAME="$(npm run release | grep v)"
          else
            TAG_NAME="v$(node -p "require('./package.json').version")-release"
          fi

          CURRENT_VERSION="$(node -p "require('./packages/icons/package.json').version")"
          PUBLISH_PACKAGE=false

          if [[ "$TAG_NAME" == *release* ]]; then
            PUBLISH_PACKAGE="$(node .github/scripts/release-guard.mjs package-state "$CURRENT_VERSION" "$PUBLISHED_VERSION")"

            if [ "$PUBLISH_PACKAGE" = "true" ]; then
              npm pack --silent -w packages/icons
            fi

            if [ ! -f release-notes.md ]; then
              printf '## rocketicons %s\n\nIncludes the CLI and agent-friendly catalog access without importing the full icon library.\n' "$CURRENT_VERSION" > release-notes.md
            fi
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "PUBLISH_PACKAGE=$PUBLISH_PACKAGE" >> $GITHUB_OUTPUT

      - name: Set output as environment variable
        run: echo "TAG_NAME=${{ steps.prepare-release.outputs.TAG_NAME }}" >> $GITHUB_ENV

      - name: Get generated package name
        id: generated-pkg-name
        env:
          TAG_NAME: ${{ steps.prepare-release.outputs.TAG_NAME }}
          PUBLISH_PACKAGE: ${{ steps.prepare-release.outputs.PUBLISH_PACKAGE }}
        run: |
          if [ "$PUBLISH_PACKAGE" = "true" ] || [[ "$TAG_NAME" != *release* ]]; then
            echo "PKG_FILE=$(ls -1 -t *.tgz | head -1)" >> $GITHUB_OUTPUT
          else
            echo "PKG_FILE=" >> $GITHUB_OUTPUT
          fi

      - name: Generate artifact for tag ${{ steps.prepare-release.outputs.TAG_NAME }}
        env:
          TAG_NAME: ${{ steps.prepare-release.outputs.TAG_NAME }}
          PUBLISH_PACKAGE: ${{ steps.prepare-release.outputs.PUBLISH_PACKAGE }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_HEAD_BRANCH: ${{ github.head_ref }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "$TAG_NAME" >> .tagrc
          node -e '
            const fs = require("node:fs");
            const root = require("./package.json");
            const { name, version } = require("./packages/icons/package.json");
            const metadata = {
              tagName: process.env.TAG_NAME,
              sourcePullRequestNumber: Number(process.env.SOURCE_PR_NUMBER),
              sourceHeadBranch: process.env.SOURCE_HEAD_BRANCH,
              sourceHeadSha: process.env.SOURCE_HEAD_SHA,
              rootVersion: root.version,
              name,
              version,
              publishPackage: process.env.PUBLISH_PACKAGE === "true"
            };
            fs.writeFileSync("release-metadata.json", JSON.stringify(metadata, null, 2) + "\n");
          '

      - name: Upload tag artifact to release job
        uses: actions/upload-artifact@v4
        with:
          name: tag-artifact
          path: .tagrc
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload deployable artifacts with package
        if: >-
          contains(steps.prepare-release.outputs.TAG_NAME, 'release') &&
          steps.prepare-release.outputs.PUBLISH_PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployable-artifacts
          path: |
            release-notes.md
            release-metadata.json
            ${{ steps.generated-pkg-name.outputs.PKG_FILE }}
          if-no-files-found: error

      - name: Upload deployable artifacts without package
        if: >-
          contains(steps.prepare-release.outputs.TAG_NAME, 'release') &&
          steps.prepare-release.outputs.PUBLISH_PACKAGE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployable-artifacts
          path: |
            release-notes.md
            release-metadata.json
          if-no-files-found: error

      - name: Upload rocketicons tgz as artifact
        if: contains(steps.prepare-release.outputs.TAG_NAME, 'release') == false
        uses: actions/upload-artifact@v4
        with:
          name: rocketicons-pkg
          path: ${{ steps.generated-pkg-name.outputs.PKG_FILE }}
          if-no-files-found: error
