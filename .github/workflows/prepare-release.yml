name: Cut Release
run-name: Cut release from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      refresh_pr:
        description: "Existing open release PR to refresh from develop (optional)"
        type: string
        required: false

permissions:
  contents: write
  packages: read

concurrency:
  group: cut-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"

jobs:
  cut-release:
    name: Prepare release from ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      AUTOMATION_USER_NAME: ${{ vars.AUTOMATION_USER_NAME }}
      AUTOMATION_USER_EMAIL: ${{ vars.AUTOMATION_USER_EMAIL }}
      SKIP_IGNITION_BUILD: true
      # Release tests and package builds must consume every collection, even on
      # a clean runner where the site generator otherwise uses its dev sample.
      RI_GENERATE_ALL_ICONS: "true"

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          # A refresh must emit a synchronize event so the existing PR is tested
          # again; pushes authenticated with GITHUB_TOKEN do not trigger CI.
          token: ${{ inputs.refresh_pr != '' && secrets.GH_ACTIONS || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate release source
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/release-guard.mjs validate-source "$SOURCE_BRANCH"

      - name: Validate release base
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "develop must include main before cutting a release. Merge main into develop and retry." >&2
            exit 1
          fi

      - name: Verify pull request automation credential
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_ACTIONS is required to open the release pull request" >&2
            exit 1
          fi
          gh api user --jq .login >/dev/null

      - name: Configure GitHub Packages
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Cache icons
        uses: actions/cache@v5
        id: icons-cache
        with:
          path: |
            packages/generator/icons
          key: ${{ runner.os }}-icons-${{ hashFiles('packages/generator/src/definitions.ts') }}
          restore-keys: |
            ${{ runner.os }}-icons-

      - name: Install packages
        run: SKIP_BUILD_ALL=true npm ci

      - name: Fetch icons
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: npm run fetch --workspace=packages/generator

      - name: Build all
        run: npm run build-all

      - name: Verify complete release catalog
        run: npm run test:catalog --workspace=packages/generator

      - name: Run tests
        run: |
          npm run test:release
          npm run test-all

      - name: Setup git user
        run: |
          git config user.name "${{ env.AUTOMATION_USER_NAME }}"
          git config user.email "${{ env.AUTOMATION_USER_EMAIL }}"

      - name: Create local release candidate
        run: |
          git switch --create "release-candidate/$GITHUB_RUN_ID"
          git config push.default nothing

      - name: Bump versions and prepare package
        id: prepare-release
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          REFRESH_PR: ${{ inputs.refresh_pr }}
          GH_TOKEN: ${{ secrets.GH_ACTIONS }}
        run: |
          PUBLISHED_VERSION="$(npm view rocketicons version)"
          CURRENT_VERSION="$(node -p "require('./packages/icons/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          CUT_MODE="$(
            node .github/scripts/release-guard.mjs cut-mode \
              "$ROOT_VERSION" \
              "$CURRENT_VERSION" \
              "$PUBLISHED_VERSION"
          )"

          if [ "$CUT_MODE" = "bump" ]; then
            node .github/scripts/release-workspaces.mjs prepare
            TAG_NAME="$(
              npm run release |
                grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+-release' |
                tail -1
            )"

            EXPECTED_COMMIT_SUBJECT="ci(releaser): bump packages versions and update changelog for release-candidate/$GITHUB_RUN_ID"
            ACTUAL_COMMIT_SUBJECT="$(git log -1 --format=%s)"
            if [ "$ACTUAL_COMMIT_SUBJECT" != "$EXPECTED_COMMIT_SUBJECT" ]; then
              echo "Unexpected release commit: $ACTUAL_COMMIT_SUBJECT" >&2
              exit 1
            fi
            node .github/scripts/release-workspaces.mjs align
            git add -- package-lock.json packages/*/package.json
          else
            TAG_NAME="v${ROOT_VERSION}-release"
            echo "::notice::Packaging already prepared rocketicons@$CURRENT_VERSION"
          fi

          ROOT_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_VERSION="$(node -p "require('./packages/icons/package.json').version")"
          RELEASE_BRANCH="$(
            node .github/scripts/release-guard.mjs release-branch \
              "$SOURCE_BRANCH" \
              "$ROOT_VERSION"
          )"

          node .github/scripts/release-guard.mjs validate-cut-result \
            "$ROOT_VERSION" \
            "$ROOT_VERSION" \
            "$TAG_NAME"

          REFRESH_HEAD=""
          if [ -n "$REFRESH_PR" ]; then
            gh pr view "$REFRESH_PR" --json state,baseRefName,headRefName,headRefOid > "$RUNNER_TEMP/refresh-pr.json"
            REFRESH_HEAD="$(node .github/scripts/release-refresh.mjs "$RUNNER_TEMP/refresh-pr.json" "$RELEASE_BRANCH")"
            git fetch --no-tags origin "$RELEASE_BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "$REFRESH_HEAD"
            test "$(git log -1 --format=%s FETCH_HEAD)" = "ci(releaser): bump packages versions and update changelog for $RELEASE_BRANCH"
            # Only replace an untouched generated cut whose source is already in
            # develop. Refuse to discard independent edits to the release branch.
            git merge-base --is-ancestor FETCH_HEAD^ HEAD
          elif git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH" >/dev/null; then
            echo "Release branch $RELEASE_BRANCH already exists; use refresh_pr for its open PR" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Release tag $TAG_NAME already exists" >&2
            exit 1
          fi

          git branch --move "$RELEASE_BRANCH"
          if [ "$CUT_MODE" = "bump" ]; then
            git commit --amend --no-verify \
              -m "ci(releaser): bump packages versions and update changelog for $RELEASE_BRANCH"
          fi
          git config --unset push.default

          PUBLISH_PACKAGE="$(
            node .github/scripts/release-guard.mjs package-state \
              "$PACKAGE_VERSION" \
              "$PUBLISHED_VERSION"
          )"

          if [ "$PUBLISH_PACKAGE" != "true" ]; then
            echo "Cut Release must package a new version" >&2
            exit 1
          fi

          # The root package version may have changed in this step. Rebuild the
          # bundled catalog at that exact version before creating release archives.
          npm run generate-catalog --workspace=packages/ignition
          node -e '
            const toolkit = require("./packages/toolkit/package.json");
            const mcp = require("./packages/mcp/package.json");
            const icons = require("./packages/icons/package.json");
            if (mcp.dependencies[toolkit.name] !== toolkit.version || icons.dependencies[toolkit.name] !== toolkit.version || icons.dependencies[mcp.name] !== mcp.version) {
              throw new Error("MCP and rocketicons dependency versions must match the packages being released");
            }
          '
          for workspace in toolkit mcp; do
            package_name="$(node -p "require('./packages/$workspace/package.json').name")"
            package_version="$(node -p "require('./packages/$workspace/package.json').version")"
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published; bump its version before cutting this release" >&2
              exit 1
            fi
          done
          npm run build --workspace=packages/toolkit
          npm run test --workspace=packages/toolkit
          npm run test --workspace=packages/mcp

          npm pack --silent -w packages/utils
          npm pack --silent -w packages/tailwind
          npm pack --silent -w packages/toolkit
          npm pack --silent -w packages/mcp
          npm pack --silent -w packages/icons

          if [ ! -f release-notes.md ]; then
            printf '## rocketicons %s\n\nIncludes the CLI and agent-friendly catalog access without importing the full icon library.\n' "$PACKAGE_VERSION" > release-notes.md
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
          echo "ROOT_VERSION=$ROOT_VERSION" >> $GITHUB_OUTPUT
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "PUBLISHED_VERSION=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
          echo "PUBLISH_PACKAGE=$PUBLISH_PACKAGE" >> $GITHUB_OUTPUT
          echo "RELEASE_HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "REFRESH_HEAD=$REFRESH_HEAD" >> $GITHUB_OUTPUT

      - name: Generate release metadata
        env:
          CUT_FROM_SHA: ${{ github.sha }}
          PACKAGE_VERSION: ${{ steps.prepare-release.outputs.PACKAGE_VERSION }}
          PUBLISH_PACKAGE: ${{ steps.prepare-release.outputs.PUBLISH_PACKAGE }}
          RELEASE_BRANCH: ${{ steps.prepare-release.outputs.RELEASE_BRANCH }}
          RELEASE_HEAD_SHA: ${{ steps.prepare-release.outputs.RELEASE_HEAD_SHA }}
          RELEASE_VERSION: ${{ steps.prepare-release.outputs.ROOT_VERSION }}
          ROOT_VERSION: ${{ steps.prepare-release.outputs.ROOT_VERSION }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          TAG_NAME: ${{ steps.prepare-release.outputs.TAG_NAME }}
        run: |
          printf '%s\n' "$TAG_NAME" > .tagrc
          node -e '
            const fs = require("node:fs");
            const { name } = require("./packages/icons/package.json");
            const metadata = {
              tagName: process.env.TAG_NAME,
              releaseVersion: process.env.RELEASE_VERSION,
              sourceWorkflowRunId: Number(process.env.SOURCE_WORKFLOW_RUN_ID),
              releaseBranch: process.env.RELEASE_BRANCH,
              releaseHeadSha: process.env.RELEASE_HEAD_SHA,
              cutFromSha: process.env.CUT_FROM_SHA,
              rootVersion: process.env.ROOT_VERSION,
              name,
              version: process.env.PACKAGE_VERSION,
              packagePrepared: process.env.PUBLISH_PACKAGE === "true"
            };
            fs.writeFileSync("release-metadata.json", JSON.stringify(metadata, null, 2) + "\n");
          '

      - name: Upload tag artifact
        uses: actions/upload-artifact@v6
        with:
          name: tag-artifact
          path: .tagrc
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deployable-artifacts
          path: |
            release-notes.md
            release-metadata.json
            *.tgz
          if-no-files-found: error

      - name: Push release branch
        env:
          RELEASE_BRANCH: ${{ steps.prepare-release.outputs.RELEASE_BRANCH }}
          REFRESH_HEAD: ${{ steps.prepare-release.outputs.REFRESH_HEAD }}
        run: |
          if [ -n "$REFRESH_HEAD" ]; then
            git push origin "$RELEASE_BRANCH" --force-with-lease="refs/heads/$RELEASE_BRANCH:$REFRESH_HEAD" --no-verify
          else
            git push --set-upstream origin "$RELEASE_BRANCH" --no-verify
          fi

      - name: Create or update release pull request
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS }}
          RELEASE_BRANCH: ${{ steps.prepare-release.outputs.RELEASE_BRANCH }}
          ROOT_VERSION: ${{ steps.prepare-release.outputs.ROOT_VERSION }}
          PACKAGE_VERSION: ${{ steps.prepare-release.outputs.PACKAGE_VERSION }}
          REFRESH_PR: ${{ inputs.refresh_pr }}
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Release

          - Root version: $ROOT_VERSION
          - npm package: rocketicons@$PACKAGE_VERSION
          - Prepared by: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Merging this PR into main triggers Release Packages.
          EOF

          if [ -n "$REFRESH_PR" ]; then
            gh pr edit "$REFRESH_PR" --body-file "$RUNNER_TEMP/release-pr.md"
          else
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore(release): $ROOT_VERSION" \
              --body-file "$RUNNER_TEMP/release-pr.md"
          fi
