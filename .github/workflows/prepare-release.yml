name: Prepare Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  NODE_VERSION: "22.x"

permissions: write-all

jobs:
  prepare-artifacts:
    name: Prepare Artifacts
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      PRE_RELEASE_TAG: ${{ vars.PRE_RELEASE_TAG }}
      AUTOMATION_USER_NAME: ${{ vars.AUTOMATION_USER_NAME }}
      AUTOMATION_USER_EMAIL: ${{ vars.AUTOMATION_USER_EMAIL }}
      SKIP_IGNITION_BUILD: true

    outputs:
      tag-name: ${{ steps.prepare-release.outputs.TAG_NAME }}
      dependency-hash: ${{ steps.extract-dependencies.outputs.DEPENDENCY_HASH }}
      rocketicons-tgz: ${{ steps.generated-pkg-name.outputs.PKG_FILE }}
      rocketicons-artifact-id: ${{ contains(steps.prepare-release.outputs.TAG_NAME, 'release') == true && 'deployable-artifacts' || 'rocketicons-pkg' }}
      vercel-url-alias: ${{ steps.branch-to-url.outputs.URL_ID }}${{ vars.VERCEL_ALIAS_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set NPM config
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Dependencies
        id: extract-dependencies
        run: echo "DEPENDENCY_HASH=$(npx --yes @rocketclimb/sh extract-dependencies)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ steps.extract-dependencies.outputs.DEPENDENCY_HASH }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache icons
        uses: actions/cache@v4
        id: icons-cache
        with:
          path: |
            packages/generator/icons
          key: ${{ runner.os }}-icons-${{ hashFiles('packages/generator/src/definitions.ts') }}
          restore-keys: |
            ${{ runner.os }}-icons-

      - name: Install packages
        if: steps.npm-cache.outputs.cache-hit != 'true'
        # `npm ci` (vs `npm install`) wipes node_modules and reinstalls
        # strictly from the lockfile. Required for Tailwind v4 because
        # `@tailwindcss/oxide` ships per-platform native binaries via
        # optionalDependencies; on partial cache restores from
        # `restore-keys`, plain `npm install` doesn't add the missing
        # platform variant (npm/cli#4828) and the integration tests
        # in @rocketicons/tailwind fail with "Cannot find native binding".
        run: |
          npm config set @rocketclimb:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          SKIP_BUILD_ALL=true npm ci

      - name: Icons Fetch
        if: steps.icons-cache.outputs.cache-hit != 'true'
        run: npm run fetch --workspace=packages/generator

      - name: Build All
        run: npm run build-all

      - name: Run tests
        run: npm run test-all

      - name: Setup git user
        run: |
          git config user.name ${{ env.AUTOMATION_USER_NAME }}
          git config user.email ${{ env.AUTOMATION_USER_EMAIL }}

      - name: Validate .versions.json is in sync with workspaces
        # The releaser reads `.versions.json` to compute version bumps; if a
        # workspace exists in package.json but is missing from
        # .versions.json, `bumpVersion(undefined, ...)` crashes deep inside
        # the releaser with a confusing TypeError. Fail fast here with a
        # clear message so future package additions don't silently break
        # the release pipeline.
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            const versions = require("./.versions.json");
            const workspaceNames = pkg.workspaces.map(ws => ws.split("/").pop());
            const missing = workspaceNames.filter(name => !(name in versions));
            if (missing.length) {
              console.error("::error::.versions.json is missing entries for: " + missing.join(", "));
              console.error("Add each missing workspace to .versions.json with its current package.json version. See packages/<name>/package.json.");
              process.exit(1);
            }
            console.log(".versions.json covers all " + workspaceNames.length + " workspaces.");
          '

      - name: Prepare tag or release
        id: prepare-release
        # The releaser script (`npm run release` -> rocketclimb-sh releaser)
        # prints the tag name on stdout. Previously this step used
        #   echo "TAG_NAME=$(npm run release | grep v)" >> $GITHUB_OUTPUT
        # which masked failures: if the releaser crashed (e.g. a package
        # missing from .versions.json caused a TypeError), the inner pipe
        # failed but the outer echo still succeeded — the step exited 0
        # with an empty TAG_NAME and the rest of the workflow silently
        # produced broken artifacts. Now we use pipefail, write the
        # releaser output to a file, extract the tag with a strict regex,
        # and explicitly fail the step if the tag is missing.
        shell: bash
        run: |
          set -euo pipefail
          npm run release 2>&1 | tee release-output.log
          TAG_NAME=$(grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)*' release-output.log | tail -n 1 || true)
          if [ -z "${TAG_NAME}" ]; then
            echo "::error::Releaser produced no tag name. The releaser may have crashed; see the 'Run npm run release' output above and release-output.log."
            exit 1
          fi
          echo "Releaser produced tag: ${TAG_NAME}"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Ignition statics
        run: npm run generate-statics:all-icons --workspace=packages/ignition

      - name: Set output as environment variable
        run: echo "TAG_NAME=${{ steps.prepare-release.outputs.TAG_NAME }}" >> $GITHUB_ENV

      - name: Branch Name to Url
        id: branch-to-url
        run: |
          echo "URL_ID=$(echo "${{ github.head_ref }}" | tr -s ' ' | tr '[:upper:]' '[:lower:]' | sed 's,[ /\.],-,g' | sed 's/--/-/g')" >> $GITHUB_OUTPUT

      - name: Get generated package name
        id: generated-pkg-name
        # Validate the releaser actually produced a tarball before
        # downstream upload steps try to consume it; previously an empty
        # PKG_FILE would silently propagate to actions/upload-artifact
        # and surface as the cryptic "Input required and not supplied: path".
        shell: bash
        run: |
          set -euo pipefail
          PKG_FILE=$(ls -1 -t *.tgz 2>/dev/null | head -n 1 || true)
          if [ -z "${PKG_FILE}" ]; then
            echo "::error::No rocketicons-*.tgz produced by the releaser. Expected one in the repo root."
            exit 1
          fi
          echo "Generated package: ${PKG_FILE}"
          echo "PKG_FILE=${PKG_FILE}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact for tag ${{ steps.prepare-release.outputs.TAG_NAME }}
        run: |
          echo "${{ steps.prepare-release.outputs.TAG_NAME }}" >> .tagrc

      - name: Upload tag artifact to release job
        uses: actions/upload-artifact@v4
        with:
          name: tag-artifact
          path: .tagrc
          # `.tagrc` is a dotfile; actions/upload-artifact@v4 skips
          # hidden files by default (silently — only a warning, the step
          # still reports success). Without this, the tag-artifact never
          # lands, and release.yml's "Download tag artifact" step fails
          # the entire npm publish flow on merge to main. See
          # https://github.com/actions/upload-artifact/blob/main/README.md#hidden-files
          include-hidden-files: true

      - name: Upload deployable artifacts to release job
        if: contains(steps.prepare-release.outputs.TAG_NAME, 'release')
        uses: actions/upload-artifact@v4
        with:
          name: deployable-artifacts
          path: |
            release-notes.md
            ${{ steps.generated-pkg-name.outputs.PKG_FILE }}

      - name: Upload rocketicons tgz as artifact
        if: contains(steps.prepare-release.outputs.TAG_NAME, 'release') == false
        uses: actions/upload-artifact@v4
        with:
          name: rocketicons-pkg
          path: ${{ steps.generated-pkg-name.outputs.PKG_FILE }}

      - name: "Tar data-helpers"
        working-directory: ./packages
        run: tar -cvf data-helpers.tar ignition/src/app/data-helpers

      - name: Upload data-helpers
        uses: actions/upload-artifact@v4
        with:
          name: data-helpers
          path: packages/data-helpers.tar
          compression-level: 9

  # Ignition preview deploys to Vercel are temporarily disabled. The
  # rocketicons.io project is being migrated off Vercel (AWS Amplify
  # config exists in amplify.yml; final deploy target TBD), and the
  # VERCEL_TOKEN org secret hasn't been rotated since May 2024 — leaving
  # this enabled fails every release PR after the (otherwise successful)
  # Prepare Artifacts job. Re-enable (or replace with the new deploy
  # target) once the docs-site hosting decision lands.
  publish-ignition:
    if: false
    needs: prepare-artifacts
    uses: ./.github/workflows/publish-ignition.yml
    with:
      dependencies-hash: ${{ needs.prepare-artifacts.outputs.dependency-hash }}
      rocketicons-tgz: ${{ needs.prepare-artifacts.outputs.rocketicons-tgz }}
      rocketicons-artifact-id: ${{ needs.prepare-artifacts.outputs.rocketicons-artifact-id }}
      vercel-url-alias: ${{ needs.prepare-artifacts.outputs.vercel-url-alias }}
      branch: ${{ github.head_ref }}
    secrets:
      token: ${{ secrets.VERCEL_TOKEN }}
