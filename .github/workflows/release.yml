name: Release Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release PR to resume using its original prepared artifacts
        required: true
        type: string

concurrency:
  group: release-packages
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: read

env:
  NODE_VERSION: "24.x"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AUTOMATION_USER_NAME: ${{ vars.AUTOMATION_USER_NAME }}
  AUTOMATION_USER_EMAIL: ${{ vars.AUTOMATION_USER_EMAIL }}

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest

    outputs:
      cut-run-id: ${{ steps.resolve-cut-run.outputs.CUT_RUN_ID }}
      cut-head-sha: ${{ steps.resolve-cut-run.outputs.CUT_HEAD_SHA }}
      source-pr-number: ${{ steps.resolve-source.outputs.SOURCE_PR_NUMBER }}
      source-head-branch: ${{ steps.resolve-source.outputs.SOURCE_HEAD_BRANCH }}
      source-head-sha: ${{ steps.resolve-source.outputs.SOURCE_HEAD_SHA }}
      release-source: ${{ steps.resolve-source.outputs.IS_RELEASE_SOURCE }}
      release-version: ${{ steps.resolve-source.outputs.RELEASE_VERSION }}
      pending-tag: ${{ steps.set-tag.outputs.PENDING_TAG }}
      is-release: >-
        ${{
          steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true' &&
          contains(steps.set-tag.outputs.PENDING_TAG, 'release')
        }}
      release-commit: ${{ steps.resolve-source.outputs.RELEASE_COMMIT }}

    steps:
      - name: Checkout workflow and complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve merged release pull request
        id: resolve-source
        env:
          RECOVERY_PR: ${{ inputs.release_pr }}
        run: node .github/scripts/release-recovery.mjs source

      - name: Resolve manual cut run
        id: resolve-cut-run
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        run: node .github/scripts/release-recovery.mjs cut

      - name: Download tag artifact
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        uses: actions/download-artifact@v7
        with:
          name: tag-artifact
          github-token: ${{ env.GH_TOKEN }}
          run-id: ${{ steps.resolve-cut-run.outputs.CUT_RUN_ID }}

      - name: Set pending tag
        id: set-tag
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        run: echo "PENDING_TAG=$(cat .tagrc)" >> $GITHUB_OUTPUT

      - name: Download release metadata
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        uses: actions/download-artifact@v7
        with:
          name: deployable-artifacts
          path: prepared-release
          github-token: ${{ env.GH_TOKEN }}
          run-id: ${{ steps.resolve-cut-run.outputs.CUT_RUN_ID }}

      - name: Validate release metadata and package version
        id: validate-release
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        env:
          RELEASE_COMMIT: ${{ steps.resolve-source.outputs.RELEASE_COMMIT }}
          CUT_HEAD_SHA: ${{ steps.resolve-cut-run.outputs.CUT_HEAD_SHA }}
          CUT_RUN_ID: ${{ steps.resolve-cut-run.outputs.CUT_RUN_ID }}
          PENDING_TAG: ${{ steps.set-tag.outputs.PENDING_TAG }}
          RELEASE_VERSION: ${{ steps.resolve-source.outputs.RELEASE_VERSION }}
          SOURCE_HEAD_BRANCH: ${{ steps.resolve-source.outputs.SOURCE_HEAD_BRANCH }}
          SOURCE_HEAD_SHA: ${{ steps.resolve-source.outputs.SOURCE_HEAD_SHA }}
        run: |
          git show "$RELEASE_COMMIT:package.json" > release-root.json
          git show "$RELEASE_COMMIT:packages/icons/package.json" > release-package.json
          ROOT_VERSION="$(node -p "require('./release-root.json').version")"
          PACKAGE_NAME="$(node -p "require('./release-package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./release-package.json').version")"
          PUBLISHED_VERSION="$(npm view "$PACKAGE_NAME" version)"
          node .github/scripts/release-guard.mjs package-state "$PACKAGE_VERSION" "$PUBLISHED_VERSION"

          node .github/scripts/release-guard.mjs validate-cut-result \
            "$RELEASE_VERSION" \
            "$ROOT_VERSION" \
            "$PENDING_TAG"

          node .github/scripts/release-guard.mjs validate-metadata \
            prepared-release/release-metadata.json \
            "$PENDING_TAG" \
            "$RELEASE_VERSION" \
            "$CUT_RUN_ID" \
            "$SOURCE_HEAD_BRANCH" \
            "$SOURCE_HEAD_SHA" \
            "$CUT_HEAD_SHA" \
            "$ROOT_VERSION" \
            "$PACKAGE_NAME" \
            "$PACKAGE_VERSION" \
            "true"

      - name: Setup git user
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        run: |
          git config user.name "${{ env.AUTOMATION_USER_NAME }}"
          git config user.email "${{ env.AUTOMATION_USER_EMAIL }}"

      - name: Create or reuse verified release tag
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE == 'true'
        env:
          PENDING_TAG: ${{ steps.set-tag.outputs.PENDING_TAG }}
          RELEASE_COMMIT: ${{ steps.resolve-source.outputs.RELEASE_COMMIT }}
        run: node .github/scripts/release-recovery.mjs tag

      - name: Report non-release main update
        if: steps.resolve-source.outputs.IS_RELEASE_SOURCE != 'true'
        run: echo "Package release skipped; releases are published only from release/<version> branches."

  create-release:
    name: Create rocketicons release
    runs-on: ubuntu-latest
    needs: create-tag
    if: needs.create-tag.outputs.is-release == 'true'
    steps:
      - name: Checkout publication helpers
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Download deployable artifacts
        uses: actions/download-artifact@v7
        with:
          name: deployable-artifacts
          path: prepared-release
          github-token: ${{ env.GH_TOKEN }}
          run-id: ${{ needs.create-tag.outputs.cut-run-id }}

      - name: Publish or verify packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node .github/scripts/release-publish.mjs prepared-release

      - name: Release ${{ needs.create-tag.outputs.pending-tag }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-tag.outputs.pending-tag }}
          target_commitish: ${{ needs.create-tag.outputs.release-commit }}
          body_path: ${{ github.workspace }}/prepared-release/release-notes.md
          token: ${{ env.GH_TOKEN }}
          files: prepared-release/rocketicons-[0-9]*.tgz
          fail_on_unmatched_files: true
