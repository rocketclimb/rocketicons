name: Bundle Size Check

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/ignition/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/ignition/**"

jobs:
  bundle-size-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd packages/ignition
          npm ci

      - name: Build project
        run: |
          cd packages/ignition
          npm run build

      - name: Check bundle size
        run: |
          cd packages/ignition
          npm run size-check

      - name: Generate bundle report
        run: |
          cd packages/ignition
          npm run size-report

      - name: Upload bundle reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-reports-${{ github.sha }}
          path: packages/ignition/bundle-reports/
          retention-days: 30

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const reportDir = 'packages/ignition/bundle-reports';
              const files = fs.readdirSync(reportDir);
              const latestReport = files
                .filter(f => f.startsWith('bundle-report-'))
                .sort()
                .pop();

              if (latestReport) {
                const reportPath = path.join(reportDir, latestReport);
                const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

                const totalSizeMB = (report.summary.totalSize / (1024 * 1024)).toFixed(2);
                const limitMB = 220;
                const usagePercent = ((report.summary.totalSize / (220 * 1024 * 1024)) * 100).toFixed(1);
                const status = parseFloat(usagePercent) > 100 ? '❌ EXCEEDS LIMIT' : '✅ WITHIN LIMIT';

                let comment = `## 📊 Bundle Size Report\n\n`;
                comment += `**Status**: ${status}\n`;
                comment += `**Total Size**: ${totalSizeMB} MB (${usagePercent}% of ${limitMB} MB limit)\n\n`;
                comment += `### Breakdown:\n`;
                comment += `- **JavaScript**: ${(report.breakdown.javascript.totalSize / (1024 * 1024)).toFixed(2)} MB\n`;
                comment += `- **CSS**: ${(report.breakdown.css.totalSize / (1024 * 1024)).toFixed(2)} MB\n`;
                comment += `- **Media**: ${(report.breakdown.media.totalSize / (1024 * 1024)).toFixed(2)} MB\n`;
                comment += `- **Other**: ${(report.breakdown.other.totalSize / (1024 * 1024)).toFixed(2)} MB\n\n`;
                comment += `### Files: ${report.summary.totalFiles}\n`;
                comment += `### Compression Savings: ${(report.summary.compressionSavings / (1024 * 1024)).toFixed(2)} MB\n\n`;

                if (report.insights.length > 0) {
                  comment += `### 💡 Insights:\n`;
                  report.insights.forEach(insight => {
                    const icon = insight.type === 'warning' ? '⚠️' : 'ℹ️';
                    comment += `- ${icon} **${insight.title}**: ${insight.description}\n`;
                  });
                  comment += `\n`;
                }

                comment += `---\n*Bundle analysis generated automatically*`;

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not generate bundle size comment:', error.message);
            }
